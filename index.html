<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Kalendarz Adwentowy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Segoe UI", system-ui, sans-serif;
  background: radial-gradient(circle at top, #fdf6e3, #8b2b14);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  overflow-x: hidden;
  color: #111;
}

.wrapper {
  position: relative;
  width: 100%;
  max-width: 1100px;
  background: rgba(255,255,255,0.97);
  padding: 26px 26px 20px;
  border-radius: 24px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.25);
  backdrop-filter: blur(10px);
  opacity: 0;
  animation: fadeIn 0.6s forwards ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* 🎄 choinki */
.tree {
  position: absolute;
  top: 6px;
  width: 90px;
  height: 150px;
  pointer-events: none;
  opacity: 0.95;
}
.tree-left  { left: 18px; }
.tree-right { right: 18px; transform: scaleX(-1); }

.tree svg {
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.35));
}

@media (max-width: 520px) {
  .tree { width: 55px; height: 95px; }
}

/* nagłówek */
header {
  text-align: center;
  margin-bottom: 18px;
  position: relative;
  z-index: 1;
}
header h1 {
  font-size: clamp(2.3rem, 4.2vw, 3rem);
  color: #8b0000;
  text-shadow: 0 1px 3px rgba(0,0,0,0.35);
  font-weight: 800;
  margin-bottom: 4px;
}
#current-date { font-weight: 600; color: #b91c1c; }
#countdown { font-weight: 600; color: #166534; }

/* kalendarz */
.calendar {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 12px;
  margin-top: 8px;
}
@media (max-width: 768px) { .calendar { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 520px) { .calendar { grid-template-columns: repeat(3, 1fr); } }

/* okienka */
.day {
  position: relative;
  padding-top: 100%;
  border-radius: 18px;
  cursor: pointer;
  overflow: hidden;
  box-shadow: 0 5px 12px rgba(0,0,0,0.25);
  transition: 0.2s;
  border: 3px solid transparent;
}
.day:hover:not(.locked) {
  transform: translateY(-4px);
  box-shadow: 0 12px 18px rgba(0,0,0,0.35);
}
.day.today {
  outline: 3px solid gold;
  box-shadow: 0 0 12px gold;
}

/* kolory */
.day.blue  { background:#1f7ec7; border-color:#0b63ab; }
.day.red   { background:#d61b6a; border-color:#ad1457; }
.day.green { background:#15803d; border-color:#0f5132; }
.day.gold  { background:#facc15; border-color:#b45309; }

/* drzwiczki */
.day-door {
  position: absolute;
  inset: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 1.8rem;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.4);
  transform-origin: left center;
  transition: 0.55s;
}
.day.locked .day-door::after {
  content: "🔒";
  position: absolute;
  right: 12px;
  bottom: 10px;
  font-size: 1.2rem;
}
.day.opened .day-door {
  transform: translateX(-105%);
  opacity: 0;
}

/* wnętrze okienka */
.day-inner {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-weight: 600;
  font-size: 1.4rem;
  opacity: 0;
  transition: 0.3s;
  color: #fefcef;
}
.day.opened .day-inner { opacity: 1; }

/* ---- modal ---- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.65);
  opacity: 0;
  pointer-events: none;
  transition: 0.25s;
  z-index: 20;
}
.modal-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

.modal {
  background: #fffdf7;
  width: 95%;
  max-width: 650px;
  border-radius: 24px;
  overflow: hidden;
  margin: auto;
  transform: translateY(20px);
  transition: 0.25s;
  box-shadow: 0 20px 40px rgba(0,0,0,0.35);
}
.modal-backdrop.open .modal { transform: translateY(0); }

.modal-header {
  padding: 14px 20px;
  background: linear-gradient(135deg,#8b0000,#ef7f23);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.modal-close {
  background:none; border:none;
  font-size:1.6rem; color:white; cursor:pointer;
}

/* treść modala */
.modal-body {
  padding: 18px 20px;
  max-height: 80vh;
  overflow-y: auto;
}

/* ramka zdjęcia */
.photo-frame {
  padding: 10px;
  border: 4px solid gold;
  background:#fff7df;
  border-radius: 15px;
  margin-bottom: 12px;
  text-align:center;
}
.photo-frame img {
  width: 100%;
  height: auto;
  max-height: 60vh;
  object-fit: contain;
  border-radius: 12px;
}

/* pola tekstowe pod zdjęciem */
.message-box, .task-box {
  padding: 10px 12px 12px;
  border-radius: 8px;
  margin-bottom: 8px;
}
.message-box {
  background:#fff5f7;
  border-left:4px solid #db2777;
}
.task-box {
  background:#fff1e6;
  border-left:4px solid #b91c1c;
}
.message-box h3,
.task-box h3 {
  margin-bottom:4px;
  font-size:0.95rem;
  text-transform:uppercase;
  letter-spacing:0.05em;
  color:#b91c1c;
}
.message-box p,
.task-box p {
  margin:0;
  font-size:1rem;
}

/* śnieg */
.snowflake {
  position: fixed;
  top: -10px;
  width: 8px; height: 8px;
  background: white;
  border-radius: 50%;
  opacity: 0.9;
  z-index: 3;
  animation: fall linear;
}
@keyframes fall {
  0% { transform: translateY(0) translateX(0); opacity:1; }
  100%{ transform: translateY(110vh) translateX(25px); opacity:0.2;}
}
</style>
</head>

  <header>

</div>

<!-- audio: gramy po kliknięciu okienka -->
<audio id="bg-music" loop></audio>

<!-- modal -->
<div id="modal-backdrop" class="modal-backdrop">

    <div class="modal-header">
      <h2 id="modal-title"></h2>
      <button id="modal-close" class="modal-close">&times;</button>
    </div>

    <div class="modal-body">
      <div class="photo-frame">
        <img id="modal-image" src="" alt="">
      </div>

      <div class="message-box">
        <h3>Od Łukasza:</h3>
        <p id="love-text"></p>
      </div>

      <div class="task-box">
        <h3>Zadanie na dziś:</h3>
        <p id="task-text"></p>
      </div>
    </div>
  </div>
</div>

/* prosty decode Base64 → UTF-8 */
function decodeB64(b64) {
  if (!b64) return "";
  try {
    return decodeURIComponent(escape(atob(b64)));
  } catch (e) {
    return atob(b64);
  }
}

function getColorClass(day) {
  const blue  = [1,4,7,10,13,16,19,22];
  const red   = [2,5,8,11,14,17,20,23];
  const green = [3,6,9,12,15,18,21];
  if (blue.includes(day))  return "blue";
  if (red.includes(day))   return "red";
  if (green.includes(day)) return "green";
  if (day === 24)          return "gold";
}

/* czas z internetu */
async function getCurrentDate() {
  try {
    const res = await fetch("https://worldtimeapi.org/api/ip");
    const data = await res.json();
    return new Date(data.datetime);
  } catch {
    return new Date();
  }
}

function renderCalendar(unlockDay) {
  for (let day = 1; day <= TOTAL_DAYS; day++) {
    const box = document.createElement("div");
    box.classList.add("day", getColorClass(day));

    if (day > unlockDay) {
      box.classList.add("locked");
    } else {
      box.onclick = () => openDay(day, box);
    }

    if (day === unlockDay && unlockDay > 0) box.classList.add("today");

    const door = document.createElement("div");
    door.classList.add("day-door");
    door.textContent = day;

    const inner = document.createElement("div");
    inner.classList.add("day-inner");
    inner.innerHTML =
      `<span>${day}</span><span style="font-size:0.85rem;">${
        day > unlockDay ? "Wkrótce" : "Otwórz"
      }</span>`;

    box.append(inner, door);
    calendar.appendChild(box);
  }
}

/* 🔁 wybór obrazka: .jpg → .JPG → placeholder */
function setImageForDay(day) {
  const base = "images/" + day;
  const candidates = [base + ".jpg", base + ".JPG"];
  let index = 0;

  function tryNext() {
    if (index >= candidates.length) {
      modalImage.src = "images/placeholder.jpg"; 
      return;
    }

    const testImg = new Image();
    const src = candidates[index++];
    testImg.onload = () => {
      modalImage.src = src;
    };
    testImg.onerror = tryNext;
    testImg.src = src;
  }

  tryNext();
}

/* otwieranie okienka + muzyka */
function openDay(day, box) {
  box.classList.add("opened");

  modalTitle.textContent = "Dzień " + day;
  setImageForDay(day);

  loveTextEl.textContent = decodeB64(loveTextsEncoded[day]);
  taskTextEl.textContent = decodeB64(taskTextsEncoded[day]);

  if (bgMusic) {
    bgMusic.pause();
    bgMusic.currentTime = 0;
    bgMusic.src = "music/" + day + ".mp3";
    bgMusic.load();
    bgMusic.play().catch(() => {});
  }

  modalBackdrop.classList.add("open");
}

modalClose.onclick = () => modalBackdrop.classList.remove("open");
modalBackdrop.onclick = (e) => {
  if (e.target === modalBackdrop) modalBackdrop.classList.remove("open");
};

/* śnieg */
setInterval(() => {
  const s = document.createElement("div");
  s.className = "snowflake";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDuration = 6 + Math.random() * 6 + "s";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 12000);
}, 450);

/* START */
(async function () {
  const initialDate = USE_FORCE_DATE ? FORCE_DATE : await getCurrentDate();
  let now = initialDate;

  function updateTime() {
    currentDateSpan.textContent = now.toLocaleString("pl-PL", {
      weekday:"long", day:"numeric", month:"long", year:"numeric",
      hour:"2-digit", minute:"2-digit", second:"2-digit"
    });
    now = new Date(now.getTime() + 1000);
  }
  updateTime();
  setInterval(updateTime, 1000);

  const year = initialDate.getFullYear();
  const eve = new Date(year, 11, 24);
  const diffDays = Math.ceil((eve - initialDate) / (1000*60*60*24));
  countdownSpan.textContent =
    diffDays > 0 ? `Do Wigilii pozostało: ${diffDays} dni` : "Dziś Wigilia!";

  const month = initialDate.getMonth();
  const unlockDay = month === 11
    ? Math.min(initialDate.getDate(), TOTAL_DAYS)
    : 0;

  renderCalendar(unlockDay);
})();

/* 🔒 prosta blokada „podglądaczy” */
document.addEventListener("contextmenu", (e) => e.preventDefault());

document.addEventListener("keydown", (e) => {
  if (
    e.key === "F12" ||
    (e.ctrlKey && e.shiftKey && ["I","J","C"].includes(e.key.toUpperCase())) ||
    (e.ctrlKey && !e.shiftKey && e.key.toUpperCase() === "U")
  ) {
    e.preventDefault();
    e.stopPropagation();
  }
});
